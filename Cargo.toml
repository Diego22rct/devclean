[package]
name = "devclean"
version = "0.1.0"
edition = "2021"
authors = ["devclean contributors"]
description = "Fast, multi-ecosystem project artifact cleaner TUI"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
jwalk = "0.8"
rayon = "1.10"
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
dunce = "1.0"

[dev-dependencies]
tempfile = "3.14"
